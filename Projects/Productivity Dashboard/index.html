<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <!-- <nav>
            
        </nav> -->
      <section class="allElems">
        <div class="todo elem" id="0">
          <img
            src="https://i.pinimg.com/736x/72/76/9a/72769ad0f81e69bd86aeb2a970ea06d1.jpg"
            alt=""
          />
          <h2>ToDo List</h2>
        </div>
        <div class="daily elem" id="1">
          <img
            src="https://i.pinimg.com/736x/f4/e1/fb/f4e1fb58b081bfa9bd786b5c58c23615.jpg"
            alt=""
          />
          <h2>Daily planner</h2>
        </div>
        <div class="moti elem" id="2">
          <img
            src="https://i.pinimg.com/736x/c1/f1/dd/c1f1dd3d4acfbb5fc44aeef6735f7eee.jpg"
            alt=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="pomo elem" id="3">
          <img
            src="https://i.pinimg.com/736x/3c/20/60/3c2060cdfc32badd89d25e6818ccfa82.jpg"
            alt=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals elem" id="4">
          <img
            src="https://i.pinimg.com/736x/cc/44/76/cc4476698aceefe39b9512bf3a1f414d.jpg"
            alt=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0"><i class="ri-arrow-left-s-line"></i></button>
        <h2>Your Personalized To Do List:</h2>
        <div class="todo-container">
            <div class="addTask"></div>
            <div class="allTask"></div>

        </div>
      </section>
      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1"><i class="ri-arrow-left-s-line"></i></button>
        <h1>Daily Planner</h1>
      </section>
      <section class="fullElem motivation-fullpage">
        <button class="back" id="2"><i class="ri-arrow-left-s-line"></i></button>
        <h1>Motivation</h1>
      </section>
      <section class="fullElem pomodoro-fullpage">
        <button class="back" id="3"><i class="ri-arrow-left-s-line"></i></button>
        <h1>Pomodoro Timer</h1>
      </section>
      <section class="fullElem daily-goal-fullpage">
        <button class="back" id="4"><i class="ri-arrow-left-s-line"></i></button>
        <h1>Daily Goals</h1>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
